name: Bug
description: Something does not work as it should
labels: ["type:bug"]
body:
  - type: textarea
    id: happens
    attributes:
      label: What happens
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps, and where (page, command, version).
    validations:
      required: true
